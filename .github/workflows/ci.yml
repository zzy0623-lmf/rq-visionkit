name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: pip install pytest fastapi "uvicorn[standard]" python-multipart httpx numpy opencv-python pyyaml psutil
      - name: Run pytest
        run: pytest tests/ annotator/tests/ converter/tests/ runtime/pc_sim/tests/ -v

  frontend:
    name: Frontend build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend project
        id: detect
        run: |
          if [ -f annotator/web/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip (frontend not scaffolded yet)
        if: steps.detect.outputs.exists == 'false'
        run: echo "annotator/web/package.json 不存在，前端尚未脚手架化（T1.2），跳过构建检查"
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.exists == 'true'
        with:
          node-version: "18"
      - name: Install and build frontend
        if: steps.detect.outputs.exists == 'true'
        working-directory: annotator/web
        run: |
          npm ci
          npm run build
